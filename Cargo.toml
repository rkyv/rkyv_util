[package]
name = "rkyv_util"
description = "Tools for zero-copy deserialization with rkyv"
version = "0.1.0-alpha.1"
authors = ["David Koloski <djkoloski@gmail.com>"]
edition = "2021"
license = "MIT"

[dependencies]
rkyv = { version = "0.8", default-features = false, features = ["bytecheck"] }
memmap2-0_9 = { package = "memmap2", version = "0.9", optional = true }

[dev-dependencies]
tempfile = "3.12.0"

[features]
default = ["std"]
alloc = ["rkyv/alloc"]
std = ["alloc", "rkyv/std"]

[patch.crates-io]
bytecheck = { git = "https://github.com/rkyv/bytecheck" }
rancor = { git = "https://github.com/rkyv/rancor" }
rkyv = { git = "https://github.com/rkyv/rkyv" }
